name: Paired ACK Payload core — C++11 and ATmega328P
on:
  push:
    branches: [main, testy, 'experiment/**']
  pull_request:
  workflow_dispatch:
jobs:
  host-protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run all active host regressions
        run: sh tests/run_host_tests.sh
      - name: Verify bidirectional binary capture harness
        run: sh tests/test_duplex_uart_vectors.sh
  avr-firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install AVR-GCC and AVR libc
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-avr avr-libc binutils-avr
      - name: Cross-compile the active paired firmware
        run: sh tests/build_avr.sh
